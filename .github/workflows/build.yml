name: Build 1.21.1-1.21.8

# One jar for every supported Minecraft 1.21.x version.
#
# The release jar is compiled against the OLDEST supported version
# (1.21.1) and declared in fabric.mod.json to run on 1.21.1-1.21.7.
# The "compat" matrix then compiles the same source against each newer
# version, so an API change that would break a newer version shows up
# as a red job BEFORE you ship. Compiling is not the same as running -
# still launch the jar once on the oldest and newest version.
on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "jar2-1.21.9-1.21.11/**", "jar3-26.1/**", "jar4-26.2/**", "jar5-26.3/**" ]
    tags: [ "v*" ]
  pull_request:
    paths-ignore: [ "jar2-1.21.9-1.21.11/**", "jar3-26.1/**", "jar4-26.2/**", "jar5-26.3/**" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build jar (compiled against 1.21.1)
    runs-on: ubuntu-latest
    env:
      MC: "1.21.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.5
      - name: Resolve Fabric versions
        id: fabric
        run: |
          set -euo pipefail
          YARN=$(curl -sf "https://meta.fabricmc.net/v2/versions/yarn/${MC}" | jq -r '.[0].version // empty')
          LOADER=$(curl -sf "https://meta.fabricmc.net/v2/versions/loader/${MC}" | jq -r '.[0].loader.version // empty')
          API=$(curl -sf "https://api.modrinth.com/v2/project/fabric-api/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${MC}%22%5D" \
            | jq -r '[.[] | select(.version_type=="release")][0].version_number // empty')
          for v in "$YARN" "$LOADER" "$API"; do [ -n "$v" ] || { echo "::error::could not resolve a Fabric version for ${MC}"; exit 1; }; done
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          gradle build --no-daemon --stacktrace
          -Pminecraft_version=${MC}
          -Pyarn_mappings=${{ steps.fabric.outputs.yarn }}
          -Ploader_version=${{ steps.fabric.outputs.loader }}
          -Pfabric_version=${{ steps.fabric.outputs.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: GTLTagger
          path: build/libs/*.jar
          if-no-files-found: error

  compat:
    name: Compile check on ${{ matrix.minecraft_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft_version: [ "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.5
      - name: Resolve Fabric versions
        id: fabric
        run: |
          set -euo pipefail
          MC="${{ matrix.minecraft_version }}"
          YARN=$(curl -sf "https://meta.fabricmc.net/v2/versions/yarn/${MC}" | jq -r '.[0].version // empty')
          LOADER=$(curl -sf "https://meta.fabricmc.net/v2/versions/loader/${MC}" | jq -r '.[0].loader.version // empty')
          API=$(curl -sf "https://api.modrinth.com/v2/project/fabric-api/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${MC}%22%5D" \
            | jq -r '[.[] | select(.version_type=="release")][0].version_number // empty')
          for v in "$YARN" "$LOADER" "$API"; do [ -n "$v" ] || { echo "::error::could not resolve a Fabric version for ${MC}"; exit 1; }; done
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
      - name: Compile against ${{ matrix.minecraft_version }}
        run: >
          gradle compileJava --no-daemon --stacktrace
          -Pminecraft_version=${{ matrix.minecraft_version }}
          -Pyarn_mappings=${{ steps.fabric.outputs.yarn }}
          -Ploader_version=${{ steps.fabric.outputs.loader }}
          -Pfabric_version=${{ steps.fabric.outputs.api }}

  release:
    name: Publish GitHub Release
    needs: [ build, compat ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GTLTagger
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
